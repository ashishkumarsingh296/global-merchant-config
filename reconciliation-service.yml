server:
  port: 8086

datasource:
    url: jdbc:mysql://mysql:3306/gmps_reconciliation
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

