server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/gmps_auth
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:mySecretKeyForGlobalMerchantPaymentPlatform2026}
  expiration: 86400000

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
